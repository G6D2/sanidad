name: Chequeo de salud

# Cada 5 minutos, todo el día. Ojo: cada chequeo despierta backend y frontend en Render
# (plan free, 750 h/mes compartidas).
#
# Los crons de GitHub son "best effort" y en esta org directamente no disparan (el 24/09
# no corrió ni uno). Por eso el workflow se encadena solo: al terminar, el job `siguiente`
# espera hasta completar 5 minutos desde el arranque y se relanza con workflow_dispatch.
# El cron queda solo como respaldo para rearrancar la cadena si se corta.
# Para arrancarla: Actions → Chequeo de salud → Run workflow.
# Para frenarla: Actions → Chequeo de salud → "Disable workflow".
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # commitear data/history.json
  actions: write    # relanzar este workflow (job `siguiente`)
  pages: write
  id-token: write

concurrency:
  group: chequeo
  cancel-in-progress: false

jobs:
  chequeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recolectar
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: python scripts/collect.py

      - name: Guardar historial
        run: |
          git config user.name "sanidad-bot"
          git config user.email "sanidad-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "chore: historial de chequeos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  siguiente:
    needs: chequeo
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Esperar hasta completar 5 minutos desde el arranque
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INICIO=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} -q .run_started_at)
          start=$(date -d "$INICIO" +%s); now=$(date +%s)
          wait=$(( 300 - (now - start) ))
          echo "Arrancó $INICIO; espero ${wait}s"
          [ "$wait" -gt 0 ] && sleep "$wait" || true

      - name: Relanzar (si no hay otra corrida en cola)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          otras=$(gh run list --workflow chequeo.yml --limit 20 --json databaseId,status \
            -q "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\")] | length")
          if [ "$otras" -gt 0 ]; then echo "Ya hay $otras corrida(s) activas o en cola; no relanzo."; exit 0; fi
          gh workflow run chequeo.yml --ref main
